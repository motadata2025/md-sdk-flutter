name: motadata_flutter_plugin
description: Flutter bindings for the Motadata Mobile RUM SDK (Android).
version: 1.0.0
repository: https://github.com/motadata2025/md-sdk-flutter
homepage: https://www.motadata.com

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  json_annotation: ^4.9.0
  jni: ^0.14.2
  ffi: ^2.1.3
  uuid: ^4.0.0
  meta: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=1.0.0"
  mocktail: ^1.0.4
  json_serializable: '>=6.7.0 <6.10.0'
  build_runner: ^2.1.11
  jnigen: ^0.14.2
  motadata_common_test:
    path: ../motadata_common_test

flutter:
  plugin:
    platforms:
      android:
        package: com.motadata.flutter
        pluginClass: MotadataSdkPlugin
